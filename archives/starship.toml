format = "via [$symbol$version]($style) "
style = "bold #00FFFF"

[gradle]
symbol = "🐘 🜌 Gradle "
format = "via [$symbol$version]($style) "
style = "bold #9B5DE5"

[java]
symbol = "☕ 🜚 Java "
format = "via [$symbol$version(-$name)]($style) "
style = "bold #F15BB5"

[kotlin]
symbol = "🜘 Kotlin "
format = "via [$symbol$version]($style) "
style = "bold #9B5DE5"

[nodejs]
symbol = "⬢ 🜁 Node "
format = "via [$symbol$version]($style) "
style = "bold #00F5D4"

[php]
symbol = "🐘 🜕 PHP "
format = "via [$symbol$version]($style) "
style = "bold #9B5DE5"

[python]
symbol = "🐍 🝆 Python "
format = "via [$symbol$version]($style) "
style = "bold #D4AF37"

[ruby]
symbol = "💎 🜚 Ruby "
format = "via [$symbol$version]($style) "
