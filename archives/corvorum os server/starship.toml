# Corvorum OS - Starship Configuration
# Aesthetic: Esoteric Code Alchemy & Mystic Ravens (ASCII-safe, tty-friendly)
# Color Palette: Deep Occult Purple (#6A0DAD), Alchemical Gold (#D4AF37), Ethereal Cyan (#00FFFF), Crimson Essence (#B22222)

format = """
[Corvorum OS](bold #9B5DE5) $sudo$directory\
$git_branch$git_commit$git_state$git_metrics$git_status\
$kubernetes$docker_context$container$vagrant$helm$terraform\
$package$c$cmake$cpp$cobol$conda$dart$golang$gradle$java$kotlin$nodejs$php$python$ruby$rust$typst\
\n[Transmutando](bold #D4AF37) $character"""

right_format = """[>>](dimmed #6A0DAD)"""

# Continuous prompt character indicating the state of the transmutation
[character]
success_symbol = "[>](bold #00FFFF)"
error_symbol = "[x](bold #B22222)"
vicmd_symbol = "[:](bold #D4AF37)"

[sudo]
disabled = false
format = "[(sudo) $symbol]($style)"
symbol = "Magus Sudo "
style = "bold #D4AF37"

[directory]
truncation_length = 4
truncation_symbol = "../"
home_symbol = "~"
read_only = " [RO]"
format = "en [$path]($style)[$read_only]($read_only_style) "
style = "bold #00FFFF"

# --- GIT & VERSION CONTROL MODULES (The Web of Fate) ---

[git_branch]
symbol = "branch:"
format = "[$symbol $branch(:$remote_branch)]($style) "
style = "bold #00F5D4"

[git_commit]
commit_hash_length = 7
only_detached = false
tag_symbol = "tag:"
format = "[($style)Commit: $hash $tag]($style) "
style = "italic dimmed #9A8C98"

[git_metrics]
added_style = "bold #00F5D4"
deleted_style = "bold #B22222"
format = "([+$added]($added_style) )([-$deleted]($deleted_style) )"
disabled = false

[git_state]
format = "\\[$state( $progress_current/$progress_total)]($style)\\] "
style = "bold #F15BB5"

[git_status]
format = "([\\[$all_status$ahead_behind\\]]($style) )"
style = "bold #9B5DE5"
stashed = "[\\$$count](italic #D4AF37) "
ahead = "[^$count](bold #00FFFF) "
behind = "[v$count](bold #B22222) "
diverged = "[<>$ahead_count/$behind_count](bold #EE4266) "
untracked = "[?$count](dimmed #9A8C98) "
staged = "[+$count](bold #00F5D4) "
modified = "[*$count](bold #D4AF37) "
renamed = "[->$count](italic #00BBF9) "
deleted = "[x$count](bold #B22222) "

# --- ENVIRONMENTS & CONTAINERS ---

[conda]
symbol = "conda: "
format = "via [$symbol$environment]($style) "
style = "bold #00BBF9"

[container]
symbol = "container: "
format = "dentro de [$symbol$name]($style) "
style = "bold red italic"

[docker_context]
symbol = "docker: "
format = "en [$symbol$context]($style) "
style = "bold #00BBF9"

[kubernetes]
symbol = "k3s: "
format = "en [$symbol$context( \\($namespace\\))]($style) "
style = "bold #9B5DE5"
disabled = false

[vagrant]
symbol = "vagrant: "
format = "via [$symbol$version]($style) "
style = "bold #9A8C98"

[helm]
symbol = "helm: "
format = "via [$symbol$version]($style) "
style = "bold #EE4266"

[terraform]
symbol = "tf: "
format = "via [$symbol$workspace]($style) "
style = "bold #F15BB5"

[package]
symbol = "pkg: "
format = "[$symbol$version]($style) "
style = "dimmed #00F5D4"

# --- COMPILED & SYSTEM LANGUAGES (The Core Elements) ---

[c]
symbol = "C: "
format = "via [$symbol$version(-$name)]($style) "
style = "bold #00FFFF"

[cmake]
symbol = "cmake: "
format = "via [$symbol$version]($style) "
style = "bold #9A8C98"

[cpp]
symbol = "Cpp: "
format = "via [$symbol$version(-$name)]($style) "
style = "bold #00F5D4"

[cobol]
symbol = "COBOL: "
format = "via [$symbol$version]($style) "
style = "italic #9A8C98"

[rust]
symbol = "rust: "
format = "via [$symbol$version]($style) "
style = "bold #EE4266"

# --- INTERPRETED & RUNTIME VIRTUES (The Liquid Shards) ---

[dart]
symbol = "dart: "
format = "via [$symbol$version]($style) "
style = "bold #00BBF9"

[golang]
symbol = "go: "
format = "via [$symbol$version]($style) "
style = "bold #00FFFF"

[gradle]
symbol = "gradle: "
format = "via [$symbol$version]($style) "
style = "bold #9B5DE5"

[java]
symbol = "java: "
format = "via [$symbol$version(-$name)]($style) "
style = "bold #F15BB5"

[kotlin]
symbol = "kotlin: "
format = "via [$symbol$version]($style) "
style = "bold #9B5DE5"

[nodejs]
symbol = "node: "
format = "via [$symbol$version]($style) "
style = "bold #00F5D4"

[php]
symbol = "php: "
format = "via [$symbol$version]($style) "
style = "bold #9B5DE5"

[python]
symbol = "python: "
format = "via [$symbol$version]($style) "
style = "bold #D4AF37"

[ruby]
symbol = "ruby: "
format = "via [$symbol$version]($style) "
style = "bold #EE4266"